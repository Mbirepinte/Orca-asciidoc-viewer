<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AsciiDoc Preview</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="app.js"></script>
  </head>
  <body>
    <main class="layout">
      <section class="pane source-pane" aria-label="AsciiDoc source">
        <header>Source <span id="status" role="status" aria-live="polite"></span></header>
        <textarea id="source" spellcheck="false" aria-label="AsciiDoc source"></textarea>
      </section>
      <section class="pane preview-pane" aria-label="AsciiDoc preview">
        <header>Preview</header>
        <div id="notice" hidden></div>
        <article id="preview" class="asciidoc"></article>
      </section>
    </main>
  </body>
</html>
